name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promotion:
    name: Verify exact private promotion
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/release-promotion-gate.yml@f6ea891f09653b8d449098817c8acfdb510731f6 # 0.14.0-dev
    with:
      version: ${{ github.ref_name }}
      runner: amsterdam
  publish:
    name: Publish attested immutable release
    needs: promotion
    permissions:
      contents: write # Create the immutable release and upload exact assets.
      id-token: write # Authenticate keyless signing through GitHub OIDC.
      attestations: write # Publish build provenance for release assets.
      artifact-metadata: write # Record artifact metadata for the published release.
    uses: NDDev-it-com/ci-workflows/.github/workflows/release-supply-chain.yml@f6ea891f09653b8d449098817c8acfdb510731f6 # 0.14.0-dev
    with:
      version: ${{ github.ref_name }}
      runner: amsterdam
      package_name: nddev-junie-cli-app
      archive_paths: >-
        AGENTS.md LICENSE README.md VERSION CHANGELOG.md .claude .gds .github build
        cli-tools config builder profiles setups references docs
      runtime_paths: >-
        AGENTS.md LICENSE README.md VERSION .claude build cli-tools config builder
        profiles setups references docs
